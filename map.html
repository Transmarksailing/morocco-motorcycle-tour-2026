  L.polylineDecorator(line,{patterns:[{offset:25,repeat:90,symbol:L.Symbol.arrowHead({pixelSize:9,polygon:false,pathOptions:{stroke:true,color:d.color,weight:3,opacity:.9}})}]}).addTo(map);
});
SIGHTS.forEach(s=>{
  L.marker([s[0],s[1]],{icon:L.divIcon({className:'',html:'<div class="pin">⭐</div>',iconSize:[17,17],iconAnchor:[8,8]})}).addTo(map)
   .bindTooltip(s[2],{permanent:true,direction:'right',className:'lbl s',offset:[6,0]});
});
HOTELS.forEach(h=>{
  L.marker([h[0],h[1]],{icon:L.divIcon({className:'',html:'<div class="pin">🏨</div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map)
   .bindTooltip(h[2],{permanent:true,direction:'right',className:'lbl',offset:[8,0]});
});
map.fitBounds(L.latLngBounds(all).pad(0.05));
const t=L.control({position:'topleft'});t.onAdd=()=>{const d=L.DomUtil.create('div','title');d.innerHTML='🏍️🇲🇦 Morocco Motorcycle Tour 2026 — the route on the roads';return d;};t.addTo(map);
const lg=L.control({position:'bottomright'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');let h='<b>Days</b>';
 DAYS.forEach(x=>h+='<div class="row"><span class="sw" style="border-top-color:'+x.color+'"></span> '+x.label+'</div>');
 h+='<div class="row" style="margin-top:5px">🏨 booked/planned hotel &nbsp; ⭐ sight</div>';
 h+='<div style="color:#666;font-size:11px;margin-top:3px">Route follows the actual roads (OSRM). Arrows = direction.</div>';d.innerHTML=h;return d;};lg.addTo(map);
</script></body></html>
